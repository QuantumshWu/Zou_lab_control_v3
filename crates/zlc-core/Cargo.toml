[package]
name = "zlc-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4", "v5"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1.12"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Time", "Wdk_System_Threading"] }

[lib]
path = "src/lib.rs"
