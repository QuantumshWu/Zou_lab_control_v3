[package]
name = "zlc-plugin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
zlc-core = { path = "../zlc-core" }
zlc-archive = { path = "../zlc-archive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }
