[package]
name = "zlc-bus"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
zlc-core = { path = "../zlc-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
# zlc-mcp finds the checkouts instruments run from by their zlc-desktop.exe processes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[build-dependencies]
zlc-resources = { path = "../zlc-resources" }
