<!doctype html>
<meta charset="utf-8">
<title>Info action button parity</title>
<link rel="stylesheet" href="../style.css">
<script src="../dist/scale.js"></script>
<pre id="result">pending</pre>
<script type="module">
import { InfoTree } from '../dist/fluent/info_pane.js';
import { command } from '../dist/fluent/button.js';
const assert=(value,message)=>{if(!value)throw Error(message)};
const near=(a,b,message)=>assert(Math.abs(a-b)<1,`${message}: ${a} != ${b}`);
const settle=()=>new Promise(resolve=>setTimeout(resolve,75));
const checks=[];
const check=async(name,test)=>{await test();checks.push(name)};
const tree=new InfoTree();tree.root.style.cssText='width:360px;height:280px';
document.body.append(tree.root);
const name='blow_away_rabi_copy_from_blow_away';
const reference=command(name,()=>{});reference.root.style.alignSelf='flex-start';document.body.append(reference.root);
const sent=[];tree.actionRequested=action=>sent.push(action);
try {
 tree.setRows([
  ['remote_sequencer pulse at Start 403',{text:name,action:'pulse:camera:403:bench:sequencer'}],
  ['remote_sequencer pulse 403',{text:name,action:'pulse:scan:403:sequencer'}],
  ['Other action',{text:'Open details',action:'details:record'}],
  ['Ordinary value','not a button'],
 ]);
 await settle();
 await check('both recorded-pulse entries remain distinct and dispatch their own key',()=>{
  const buttons=[...tree.root.querySelectorAll('.info-action button')];
  assert(buttons.length===3,'action rows missing');buttons[0].click();buttons[1].click();
  assert(JSON.stringify(sent)===JSON.stringify(['pulse:camera:403:bench:sequencer','pulse:scan:403:sequencer']),'wrong pulse dispatch');
 });
 for(const [scale,lead] of [[1,3],[1.25,4],[1.5,5]]) await check(`button and action-row geometry at scale ${scale}`,async()=>{
  document.documentElement.style.setProperty('--fluent',String(scale));await settle();
  const holder=tree.root.querySelector('.info-action'),button=holder.querySelector('button'),row=holder.parentElement;
  const h=holder.getBoundingClientRect(),b=button.getBoundingClientRect(),r=row.getBoundingClientRect();
  const padding=parseFloat(getComputedStyle(holder).paddingTop);
  near(b.height,reference.root.getBoundingClientRect().height,'normal FluentButton height');
  near(b.width,reference.root.getBoundingClientRect().width,'normal FluentButton width');
  const qt=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--qt'));
  near(b.left-h.left,lead*qt,'QTreeView item content inset before the zero-margin holder');
  near(parseFloat(getComputedStyle(holder).paddingRight),padding,'right item padding');
  near(b.top-r.top,padding,'top row padding');
  near(r.bottom-b.bottom,padding,'bottom row padding');
  assert(getComputedStyle(button).whiteSpace==='nowrap','pulse label wraps');
 });
 await check('action presses preserve row selection while names and holder whitespace select their row',()=>{
  const rows=[...tree.root.querySelectorAll('.info-row')];
  const press=target=>target.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,button:0}));
  press(rows[3].querySelector('.info-name'));
  for(const row of rows.slice(0,3)) {
   const button=row.querySelector('button');press(button);button.click();
   assert(rows[3].classList.contains('selected')&&!row.classList.contains('selected'),'action press changed row selection and hover colour');
  }
  press(rows[0].querySelector('.info-name'));
  assert(rows[0].classList.contains('selected')&&!rows[3].classList.contains('selected'),'name did not select its row');
  press(rows[1].querySelector('.info-action'));
  assert(rows[1].classList.contains('selected')&&!rows[0].classList.contains('selected'),'holder whitespace did not select its row');
 });
 await check('long pulse names remain accessible through horizontal scrolling',()=>{
  assert(tree.root.scrollWidth>tree.root.clientWidth,'long action was cut instead of scrollable');
  const button=tree.root.querySelector('.info-action button');
  assert(button.textContent===name&&button.scrollWidth<=button.clientWidth+1,'pulse name was truncated');
 });
 await check('ordinary values remain text and every info action uses the same presentation',()=>{
  const rows=[...tree.root.querySelectorAll('.info-row')];
  assert(!rows[3].querySelector('button'),'ordinary value became an action');
  const detail=rows[2].querySelector('button');detail.click();assert(sent.at(-1)==='details:record','generic action broke');
 });
 await check('the filter searches the visible pulse name, not an opaque action identifier',()=>{
  tree.applyFilter('blow_away_rabi');
  const rows=[...tree.root.querySelectorAll('.info-row')];
  assert(!rows[0].hidden&&!rows[1].hidden&&rows[2].hidden&&rows[3].hidden,'pulse name did not match both entries');
  assert(rows[0].querySelector('.info-value').classList.contains('match'),'matching button value was not highlighted');
  tree.applyFilter('');
 });
 await check('a crowded scrolling tree keeps text, buttons and hover inside the same full-height rows',async()=>{
  tree.root.style.cssText='position:fixed;left:20px;top:20px;width:360px;height:2400px;flex:none';
  tree.setRows([
   ...Array.from({length:40},(_,i)=>[`Setting ${i}`,`Value ${i}`]),
   ['remote_sequencer pulse at Start 403',{text:name,action:'pulse:start'}],
   ['remote_sequencer pulse 403',{text:name,action:'pulse:scan'}],
  ]);
  const geometry=()=>[...tree.root.querySelectorAll('.info-row')].map(row=>{
   const name=row.querySelector('.info-name'),range=document.createRange();range.selectNodeContents(name);
   return {row:row.getBoundingClientRect(),name:name.getBoundingClientRect(),value:row.querySelector('.info-value').getBoundingClientRect(),text:range.getBoundingClientRect(),button:row.querySelector('button')?.getBoundingClientRect()};
  });
  for(const scale of [1,1.25]) {
   document.documentElement.style.setProperty('--fluent',String(scale));tree.root.style.height='2400px';await settle();
   const roomy=geometry();
   for(const height of [140,220]) {
    tree.root.style.height=`${height}px`;await settle();tree.root.scrollTop=tree.root.scrollHeight;
    assert(tree.root.scrollHeight>tree.root.clientHeight,'crowded tree does not scroll');
    geometry().forEach((g,i)=>{
     near(g.row.height,roomy[i].row.height,`row ${i} height is independent of viewport height`);
     for(const cell of [g.name,g.value]) {near(cell.top,g.row.top,`row ${i} cell top`);near(cell.bottom,g.row.bottom,`row ${i} cell bottom`)}
     near((g.text.top+g.text.bottom)/2-g.row.top,(roomy[i].text.top+roomy[i].text.bottom)/2-roomy[i].row.top,`row ${i} text vertical alignment`);
     if(g.button) near((g.button.top+g.button.bottom)/2,(g.row.top+g.row.bottom)/2,`row ${i} button centered inside hover`);
    });
    const last=geometry().at(-1),view=tree.root.getBoundingClientRect();
    assert(last.row.bottom<=view.top+tree.root.clientTop+tree.root.clientHeight+1,'last action is clipped at scroll end');
   }
  }
 });
 document.getElementById('result').textContent=JSON.stringify({passed:true,count:checks.length,checks});
}catch(error){document.getElementById('result').textContent=JSON.stringify({passed:false,error:error.stack})}
</script>
