<!doctype html>
<meta charset="utf-8">
<title>Figure open path regression tests</title>
<link rel="stylesheet" href="../style.css">
<script src="../dist/scale.js"></script>
<pre id="result">pending</pre>
<script type="module">
import { FigureViewerView } from '../dist/views/figure_viewer.js';
import { applyChanges } from '../dist/transport.js';
const assert=(value,message)=>{if(!value)throw Error(message)};
const equal=(actual,expected,message)=>assert(JSON.stringify(actual)===JSON.stringify(expected),`${message}: ${JSON.stringify(actual)}`);
const checks=[],sent=[];
const transport={pending:new Map(),lastError:'',notice:null,busyText(){return ''},send(command){sent.push(command);return sent.length}};
const ctx={transport,latest:{type:'state',viewer:{document:{path:''},panels:[],signals:[],plot_kinds:[]}},show(){}};
const board={root:document.createElement('div'),size:0,presenting:false};
const viewer=new FigureViewerView(ctx,board);document.body.append(viewer.root);
const input=viewer.root.querySelector('.path-edit input');
const buttons=[...viewer.root.querySelectorAll('.path-edit button')];
const browse=buttons.find(b=>b.textContent.trim()==='Browse…');
const refresh=buttons.find(b=>b.textContent.trim()==='Refresh');
const accept=(path,request,error=null)=>{ctx.latest.viewer.document={path};viewer.update({type:'state',request,error})};
const typed=path=>{input.value=path;input.dispatchEvent(new Event('change',{bubbles:true}))};
const IMAGE='C:\\data files\\扫描 01.v2.PNG',ARCHIVE='C:\\data files\\扫描 01.v2.npz';
const check=(name,test)=>{test();checks.push(name)};
try {
 accept('',0);
 check('the information pane has no duplicate Raw metadata page',()=>{
  equal([...viewer.info.tabs.strip.querySelectorAll('.tab-label')].map(label=>label.textContent),['Plot','Logic','Devices','Flow'],'info tabs');
 });
 check('a Figure\'s record is asked for when a tab that shows it is looked at, not before',()=>{
  const shown=record=>{ctx.latest.viewer.document={path:ARCHIVE,record};viewer.update({type:'state',request:0,error:null})};
  const before=sent.length;
  shown('unread');equal(sent.length,before,'opening on the Plot tab reads nothing');
  viewer.info.tabs.setCurrent('Logic');equal(sent.at(-1),{action:'read_record'},'looking at Logic');
  shown('reading');viewer.info.tabs.setCurrent('Devices');equal(sent.length,before+1,'asked once');
  shown('read');viewer.info.tabs.setCurrent('Flow');equal(sent.length,before+1,'nothing more to read');
  shown('unread');equal(sent.at(-1),{action:'read_record'},'a Figure opened while a record tab shows');equal(sent.length,before+2,'asked at once');
  viewer.info.tabs.setCurrent('Plot');accept('',0);
 });
 check('a record arrives once: other messages cost nothing and the pane keeps it; a new one replaces it; none clears it',()=>{
  // As the page gets them: delta changes on the sections it holds (transport.ts), merged into latest (shell.ts).
  let sections={};
  const message=changes=>{const [next,touched]=applyChanges(sections,changes);sections=next;for(const key of touched)ctx.latest[key]=sections[key];viewer.update({type:'state',request:0,error:null})};
  const rows=()=>viewer.info.root.textContent;
  let stringified=0,setTabs=0,setGraph=0;
  const stringify=JSON.stringify,tabsOf=viewer.info.setTabs.bind(viewer.info),graphOf=viewer.info.setGraph.bind(viewer.info);
  viewer.info.setTabs=tabs=>{setTabs++;tabsOf(tabs)};viewer.info.setGraph=(title,graph)=>{setGraph++;graphOf(title,graph)};
  const tab=(title,row)=>[title,[[row,'value']]];
  const first=[tab('Plot','plot row'),tab('Logic','logic row'),tab('Devices','device row'),['Flow',[]]];
  ctx.latest.viewer.document={path:ARCHIVE,record:'read'};
  message([[['record'],{info:first,flow:{nodes:[],edges:[]}}]]);
  equal([setTabs,setGraph],[1,1],'first message shown');
  assert(rows().includes('logic row'),'the panel shows the tabs');
  JSON.stringify=value=>{const text=stringify(value);if(text?.includes('logic row'))stringified++;return text};
  try {
   // What a pointer gesture's message does: the panels change, no record section.
   for(let n=0;n<3;n++)message([[['viewer'],{}]]);
  } finally {JSON.stringify=stringify}
  equal([setTabs,setGraph,stringified],[1,1,0],'no setTabs, no setGraph, no stringify');
  assert(rows().includes('logic row'),'the panel still shows the tabs');
  // A record whose tabs changed and whose Flow did not (the record read): only the tabs.
  message([[['record','info',1,1,0,0],'read row']]);
  equal([setTabs,setGraph],[2,1],'one part changed');
  assert(rows().includes('read row')&&!rows().includes('logic row'),'the read row shown');
  // Another file: replaced. A refresh is the same message.
  message([[['record','info'],[tab('Plot','plot row'),tab('Logic','other file'),tab('Devices','device row'),['Flow',[]]]]]);
  assert(rows().includes('other file')&&!rows().includes('read row'),'another file replaces them');
  // The Figure gone (keys deleted): the pane stands empty.
  message([[['record','info']],[['record','flow']]]);
  assert(!rows().includes('other file'),'cleared');
  equal([...viewer.info.tabs.strip.querySelectorAll('.tab-label')].map(label=>label.textContent),['Plot','Logic','Devices','Flow'],'its tabs stand');
  viewer.info.setTabs=tabsOf;viewer.info.setGraph=graphOf;delete ctx.latest.record;ctx.latest.viewer={document:{path:''},panels:[],signals:[],plot_kinds:[]};accept('',0);
 });
 check('Browse requests the native visual picker without guessing a path',()=>{
  assert(browse.title.includes('thumbnails')&&browse.title.includes('same-named'),'visual matching guidance missing');
  browse.click();equal(sent.at(-1),{action:'open'},'Browse');
 });
 check('a pasted image path reaches the shared native pairing resolver intact',()=>{
  typed(IMAGE);equal(sent.at(-1),{action:'open',path:IMAGE},'image path, including spaces and Unicode');
  accept(ARCHIVE,sent.length);equal(viewer.info.path.value,ARCHIVE,'accepted data path');
 });
 check('Refresh reopens the resolved archive, not the preview',()=>{
  refresh.click();equal(sent.at(-1),{action:'open',path:ARCHIVE},'refresh');
 });
 check('cancelling Browse preserves the current figure',()=>{
  browse.click();accept(ARCHIVE,sent.length);
  equal(viewer.info.path.value,ARCHIVE,'cancelled picker kept figure');
  equal(sent.at(-1),{action:'open'},'cancel does not create another open');
 });
 check('missing pairs leave the accepted figure in place',()=>{
  typed('C:\\other folder\\orphan.jpg');transport.lastError='No matching data archive for orphan.jpg';
  accept(ARCHIVE,sent.length,transport.lastError);
  equal(viewer.info.path.value,ARCHIVE,'failed open retained prior archive');
  assert(viewer.root.textContent.includes('No matching data archive'),'pairing error is visible');
  transport.lastError='';
 });
 check('direct archive opening and empty input still behave normally',()=>{
  typed(ARCHIVE);equal(sent.at(-1),{action:'open',path:ARCHIVE},'NPZ');
  const count=sent.length;typed('');equal(sent.length,count,'empty input sends nothing');
 });
 document.getElementById('result').textContent=JSON.stringify({passed:true,count:checks.length,checks});
} catch(error) {document.getElementById('result').textContent=JSON.stringify({passed:false,error:error.stack})}
</script>
