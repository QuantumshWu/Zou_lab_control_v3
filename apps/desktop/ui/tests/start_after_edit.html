<!doctype html>
<meta charset="utf-8">
<title>Start after an edit regression tests</title>
<link rel="stylesheet" href="../style.css">
<script src="../dist/scale.js"></script>
<pre id="result">pending</pre>
<script type="module">
// Run with tools/test_ui.ps1. A Start (or Restart) clicked while an edit of its node sent from this window is
// unanswered -- a field committed by the blur of that very click -- waits, saying "Starting…", and goes once the
// edits are answered, with the revision read at the click chained through their replies (views/logic.ts NodeStarts):
// the operator's own edits are part of what they start; a change from elsewhere, before or after them, is still
// refused. The workbench here is a fake one that takes the window's
// commands in the order they were sent, as the host does.
import {TaskConsoleView} from '../dist/views/task_console.js';
import {FigureViewerView} from '../dist/views/figure_viewer.js';
import {PanelBoard} from '../dist/views/board.js';
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const equal=(actual,expected,message)=>assert(JSON.stringify(actual)===JSON.stringify(expected),`${message}: ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`);
const results=[];
const check=async(name,test)=>{await test();results.push(name)};
/** This window's transport: what it sends, in order, with what was answered between. */
const log=[];let next=0;
const transport={pending:new Map(),lastError:'',notice:null,busyText(){return [...this.pending.values()].at(-1)??''},
  send(command,feedback){const id=++next;log.push({sent:id,...command});if(feedback)this.pending.set(id,feedback);return id},
  post(){},report(error){throw error},choosePath(){return Promise.resolve(null)}};
const nodeRow=(node,fields={})=>({node_id:node,name:node,type_id:'calibration',node_kind:'task',draft_revision:1,values:{label:'a'},
  controls:[{name:'label',label:'Label',kind:'text',value:'a'}],source_signal:null,source_label:null,source_choices:[],device_keys:{},device_choices:{},
  device_labels:{},artifact_inputs:{},artifact_specs:[],auto_preview:false,outputs:[],issues:[],can_start:true,can_stop:true,preview_offered:true,
  edited:false,state:'running',status:'running',phase:'running',run:null,editor_facts:null,...fields});
/** The workbench, faked: one step takes this window's next command in the order sent and answers it on the state
 * that carries its change -- an edit (or a revert) moves the draft revision on and says it, a Start of another
 * revision is refused, a Stop leaves the node idle, a Remove takes it away. `foreign` is a change made elsewhere,
 * told to this window or not yet. */
function workbench(rows,deliver){
  let taken=0;
  const apply=command=>{
    const row=rows.find(item=>item.node_id===command.node);
    if(!row)return {error:`No logic node "${command.node}"`};
    if(command.action==='edit_node'){
      if(command.refuse)return {error:'the edit is refused'};
      if(command.values){row.values={...row.values,...command.values};row.controls=row.controls.map(control=>({...control,value:row.values[control.name]}));row.draft_revision++;row.edited=true}
      if('auto_preview' in command)row.auto_preview=command.auto_preview;
      return {result:{node:row.node_id,draft_revision:row.draft_revision}};
    }
    if(command.action==='revert_node'){row.values={label:'a'};row.edited=false;row.draft_revision++;return {result:{node:row.node_id,draft_revision:row.draft_revision}}}
    if(command.action==='start_node'){
      if(command.expected_draft_revision!==undefined&&command.expected_draft_revision!==row.draft_revision)
        return {error:`${row.name} changed (draft revision ${row.draft_revision} is not ${command.expected_draft_revision}); read it again`};
      Object.assign(row,{phase:'running',state:'running',can_stop:true,started:(row.started??0)+1});return {result:{node:row.node_id}};
    }
    if(command.action==='stop_node'){Object.assign(row,{phase:'idle',state:'idle',status:'stopped',can_stop:false});return {result:{node:row.node_id}}}
    if(command.action==='remove_node'){rows.splice(rows.indexOf(row),1);return {result:{node:command.node}}}
    return {result:null};
  };
  const host={rows,handled:[],
    step(){
      const command=log.filter(entry=>entry.sent!==undefined)[taken++];
      if(!command)return null;
      const reply=apply(command);host.handled.push({action:command.action,...reply});log.push({answered:command.sent,...(reply.error?{error:reply.error}:{})});
      transport.pending.delete(command.sent);deliver({type:'state',request:command.sent,result:reply.result??null,error:reply.error??null});
      return reply;
    },
    /** Every command sent and not yet taken, taken. */
    drain(){while(host.step());},
    /** A state pushed to this window that answers none of its commands. */
    tell(){deliver({type:'state'})},
    foreign(node,told){rows.find(item=>item.node_id===node).draft_revision++;if(told)host.tell()},
  };
  return host;
}
const starts=()=>log.filter(entry=>entry.action==='start_node');
const field=(root,label)=>[...root.querySelectorAll('.field')].find(node=>node.querySelector('.field-label')?.textContent.replace(/ \*$/,'')===label).querySelector('input');
/** A text field committed by its blur: typed, then left. */
const type=(input,text)=>{input.value=text;input.dispatchEvent(new InputEvent('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))};
/** What a command button says now (its current word). */
const said=button=>(button.querySelector('.words .current')??button).textContent.trim();
const button=(root,words)=>[...root.querySelectorAll('.logic-editor-actions button')].find(node=>words.test(said(node)));
const startButton=root=>button(root,/^(Start|Restart|Starting…)\*?$/);
const refused=reply=>/changed \(draft revision \d+ is not \d+\)/.test(reply?.error??'');
/** The Task Console with the node's Edit page open, on a fake workbench. */
function consoleWindow(){
  log.length=0;
  const rows=[nodeRow('scan')];
  const ctx={transport,latest:{type:'state',logic:structuredClone(rows),board:{panels:[],paused:false,selectors:true,active_task:null,frozen:{}},panels:[]},show(){}};
  const view=new TaskConsoleView(ctx,new PanelBoard(transport));document.body.append(view.root);
  view.update({type:'state'});
  view.intents.edit('scan');
  const host=workbench(rows,state=>{ctx.latest.logic=structuredClone(rows);view.update(state)});
  return {host,view,page:view.editors.get('scan').root,done:()=>view.root.remove()};
}
/** The Figure Viewer with its node's page, on a fake workbench. */
function viewerWindow(){
  log.length=0;
  const rows=[nodeRow('figure-1-derive',{node_kind:'processor'})];
  const ctx={transport,latest:{type:'state',viewer:{document:{path:'C:\\d\\a.npz'},panels:[],signals:[],plot_kinds:[],processor_types:[],logic:structuredClone(rows)}},show(){}};
  const view=new FigureViewerView(ctx,{root:document.createElement('div'),size:0,presenting:false});document.body.append(view.root);
  view.update({type:'state'});
  const host=workbench(rows,state=>{ctx.latest.viewer.logic=structuredClone(rows);view.update(state)});
  return {host,view,page:view.root.querySelector('.logic-editor'),done:()=>view.root.remove()};
}
try {
 await check('a Restart clicked as an edit of its node is sent waits for the edit\'s answer, says "Starting…", and goes once with the edited revision',()=>{
   const {host,view,page,done}=consoleWindow();
   type(field(page,'Label'),'b');startButton(page).click();
   equal(starts(),[],'no Start before the edit is answered');
   assert(said(startButton(page))==='Starting…'&&startButton(page).disabled,'the page says "Starting…" and takes no second click');
   assert([...view.root.querySelectorAll('button')].filter(node=>said(node)==='Starting…').length>=2,'its row says it too');
   equal(host.step().error,undefined,'the edit taken');
   equal(starts().map(entry=>entry.expected_draft_revision),[2],'one Start, with the edited revision');
   assert(log.findIndex(entry=>entry.answered!==undefined)<log.findIndex(entry=>entry.action==='start_node'),'sent after the edit\'s answer');
   equal(host.step().error,undefined,'the Start taken');equal(host.rows[0].started,1,'started once');
   done();
 });
 await check('an edit refused: the waiting Start goes with the revision read at the click',()=>{
   const {host,page,done}=consoleWindow();
   type(field(page,'Label'),'c');log.at(-1).refuse=true;startButton(page).click();
   assert(host.step().error,'the edit refused');
   equal(starts().map(entry=>entry.expected_draft_revision),[1],'one Start, with the revision read at the click');
   equal(host.step().error,undefined,'the Start taken');
   done();
 });
 await check('with no edit of its own unanswered a Start goes at once, and a change from elsewhere still has it refused',()=>{
   const {host,page,done}=consoleWindow();
   host.foreign('scan',false);startButton(page).click();
   equal(starts().map(entry=>entry.expected_draft_revision),[1],'sent at once, with the revision this window read');
   assert(refused(host.step()),'refused: read it again');
   done();
 });
 await check('a change from elsewhere before the edit is still refused, told to this window or not',()=>{
   for(const told of [false,true]){
     const {host,page,done}=consoleWindow();
     type(field(page,'Label'),'b');startButton(page).click();
     host.foreign('scan',told);host.step();
     equal(starts().map(entry=>entry.expected_draft_revision),[2],`${told?'told':'not told'}: the click's revision and the edit's own step`);
     assert(refused(host.step()),`${told?'told':'not told'}: refused`);
     done();
   }
 });
 await check('a refused edit and a change from elsewhere told meanwhile: the Start is refused',()=>{
   const {host,page,done}=consoleWindow();
   type(field(page,'Label'),'b');log.at(-1).refuse=true;startButton(page).click();
   host.foreign('scan',true);host.step();
   equal(starts().map(entry=>entry.expected_draft_revision),[1],'the click\'s revision');
   assert(refused(host.step()),'refused');
   done();
 });
 await check('a change from elsewhere after the edit is refused',()=>{
   const {host,page,done}=consoleWindow();
   type(field(page,'Label'),'b');startButton(page).click();
   host.step();host.foreign('scan',false);
   assert(refused(host.step()),'refused');
   done();
 });
 await check('the node removed elsewhere while the Start waits: it still says the revision read at the click',()=>{
   const {host,page,done}=consoleWindow();
   type(field(page,'Label'),'b');startButton(page).click();
   host.rows.splice(0,1);host.tell();
   host.step();
   equal(starts().map(entry=>entry.expected_draft_revision),[1],'never sent without the revision');
   done();
 });
 await check('a Revert, then Restart: the Start goes with the reverted revision, taken',()=>{
   const {host,page,done}=consoleWindow();
   type(field(page,'Label'),'b');host.step();
   button(page,/^Revert$/).click();startButton(page).click();
   equal(starts(),[],'waits for the revert');
   host.step();
   equal(starts().map(entry=>entry.expected_draft_revision),[3],'the reverted revision');
   equal(host.step().error,undefined,'taken');
   done();
 });
 await check('the Figure Viewer\'s node page waits the same way',()=>{
   {
     const {host,page,done}=viewerWindow();
     type(field(page,'Label'),'b');startButton(page).click();
     equal(starts(),[],'no Start before the edit is answered');assert(said(startButton(page))==='Starting…','"Starting…"');
     host.step();
     equal(starts().map(entry=>entry.expected_draft_revision),[2],'one Start, with the edited revision');
     equal(host.step().error,undefined,'taken');
     done();
   }
 });
 document.getElementById('result').textContent=JSON.stringify({passed:true,count:results.length,tests:results});
} catch(error) {document.getElementById('result').textContent=JSON.stringify({passed:false,completed:results,error:String(error.stack)})}
document.title='done';
</script>
