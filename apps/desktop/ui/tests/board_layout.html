<!doctype html>
<meta charset="utf-8">
<title>Board layout regression tests</title>
<pre id="result">pending</pre>
<script type="module">
// Run with tools/test_ui.ps1. No DOM: v2 tests/test_board_mixed_sizes.py and the board cases of test_controls_smoke.py,
// on board_layout's port. The rectangles are the presets' frames at v2's offscreen scale and the gap its card pad:
// this file's inputs, not the product's constants; every expected place is derived from them.
import {BoardMetrics, GeomProxy, drop, firstFreeSlot, gravitySlot, makeWay, minBoardWidth, overlapsWithGap, pack, slotUnder} from '../dist/views/board_layout.js';
const assert = (condition, message) => { if (!condition) throw Error(message); };
const equal = (actual,expected,message) => assert(JSON.stringify(actual)===JSON.stringify(expected),`${message}: ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`);
const results=[];
const check=async(name,test)=>{await test();results.push(name)};
const GAP=7, METRICS=new BoardMetrics(GAP);
const SIZES={'1x2':[504,282],'2x2':[504,408],'4x2':[504,660],'2x4':[840,408],'4x4':[840,660]};
// Where a carried card's strip line is, from its top: a board aims at the pointer's x on this line.
const STRIP=21;
const card=(size,col=0,row=0)=>new GeomProxy(...SIZES[size],col,row);
const box=(width,height,col=0,row=0)=>new GeomProxy(width,height,col,row);
const places=cards=>cards.map(c=>[c.col,c.row]);
const colAfter=(...sizes)=>GAP+sizes.reduce((sum,size)=>sum+SIZES[size][0]+GAP,0);
const rowAfter=(...sizes)=>GAP+sizes.reduce((sum,size)=>sum+SIZES[size][1]+GAP,0);
/** A board of these cards as Add tiles it. */
function tiled(sizes,boardW){const placed=[];for(const size of sizes){const c=card(size);[c.col,c.row]=firstFreeSlot(c,placed,boardW,METRICS);placed.push(c)}return placed}
/** The slot a card carried by `hold` and drawn at `drawn` is aimed at, on the board as it stood at pick-up. */
const slot=(board,carried,drawn,hold,boardW)=>slotUnder([drawn[0]+hold[0],drawn[1]+STRIP],carried,board.filter(c=>c!==carried),METRICS,boardW,drawn);
/** The board once `carried` is let go at `at` -- on copies, as a preview is. */
function letGo(board,carried,at,boardW){const after=board.map(c=>box(c.width,c.height,c.col,c.row));drop(after,after[board.indexOf(carried)],at,METRICS,boardW);return after}
try {
 await check('the screenshot case: a card rises into the hole under a short card',()=>{
   // A short top-left, B tall beside it, C after them on a board two cards wide: C stands under A, not under B.
   const boardW=3*GAP+2*SIZES['1x2'][0]+100,expected=[[GAP,GAP],[colAfter('1x2'),GAP],[GAP,rowAfter('1x2')]];
   assert(rowAfter('1x2')<rowAfter('4x2')&&boardW<colAfter('1x2','4x2')+SIZES['2x2'][0]+GAP,'the case is the one meant');
   equal(places(tiled(['1x2','4x2','2x2'],boardW)),expected,'Add tiles it there');
   // Where reading-order rows put it (below the tallest card of the row above), gravity lifts it.
   const cards=[card('1x2',GAP,GAP),card('4x2',colAfter('1x2'),GAP),card('2x2',GAP,rowAfter('4x2'))];
   pack(cards,METRICS,boardW);
   equal(places(cards),expected,'packed');
 });
 await check('a card let go onto another swaps with it',()=>{
   const [w2,w4]=[SIZES['2x2'][0],SIZES['4x4'][0]];
   const cases=[[Array(4).fill('2x2'),1104,2,3],[Array(4).fill('2x2'),1104,0,3],[['2x2','4x4','2x4'],1400,0,1],[['2x2','4x4','2x4'],1400,1,0],
     [['2x4','4x4','2x2'],1104,0,1],[['2x4','4x4','2x2'],1104,1,0]];
   const landed=new Map(), key=(sizes,at,far)=>JSON.stringify([sizes,at,far]);
   for(const [sizes,boardW,carriedAt,onto] of cases){
     const board=tiled(sizes,boardW),carried=board[carriedAt],target=board[onto];
     for(const hold of [[14,STRIP],[carried.width-110,STRIP]]){
       const at=slot(board,carried,[target.col+10,target.row+10],hold,boardW);
       equal(at,[target.col,target.row],`slot ${sizes} ${carriedAt} ${hold}`);
       landed.set(key(sizes,carriedAt,hold[0]>14),places(letGo(board,carried,at,boardW)));
     }
   }
   const grid=[[GAP,GAP],[colAfter('2x2'),GAP],[GAP,rowAfter('2x2')],[colAfter('2x2'),rowAfter('2x2')]];
   for(const far of [false,true]){
     equal(landed.get(key(Array(4).fill('2x2'),2,far)),[grid[0],grid[1],grid[3],grid[2]],'bottom-left onto bottom-right');
     equal(landed.get(key(Array(4).fill('2x2'),0,far)),[grid[3],grid[1],grid[2],grid[0]],'top-left onto bottom-right');
     // The 4x4 on the left and the 2x2 right of it, whichever was carried.
     const beside=[[colAfter('4x4'),GAP],[GAP,GAP],[GAP,rowAfter('4x4')]];
     equal(landed.get(key(['2x2','4x4','2x4'],0,far)),beside,'2x2 onto 4x4');
     equal(landed.get(key(['2x2','4x4','2x4'],1,far)),beside,'4x4 onto 2x2');
     // The 4x4 on top and the 2x4 under it, whichever was carried.
     const stacked=[[GAP,rowAfter('4x4')],[GAP,GAP],[GAP,rowAfter('4x4','2x4')]];
     equal(landed.get(key(['2x4','4x4','2x2'],0,far)),stacked,'2x4 onto 4x4');
     equal(landed.get(key(['2x4','4x4','2x2'],1,far)),stacked,'4x4 onto 2x4');
   }
   assert(colAfter('4x4')+w2<=1400-GAP && 1400-GAP<colAfter('2x2','2x2')+w4,'the case is the one meant');
 });
 await check('a card let go on empty space takes it, and one under a tall card stays under it',()=>{
   const board=[card('2x4',GAP,GAP),card('4x4',colAfter('2x4'),GAP),card('2x2',GAP,rowAfter('2x4'))];
   const small=board[2],under=[colAfter('2x4'),rowAfter('4x4')];
   const at=slot(board,small,[under[0]+10,under[1]+10],[14,STRIP],1900);
   equal(at,under,'slot');
   equal(places(letGo(board,small,at,1900)),[...places(board.slice(0,2)),under],'landed');
 });
 await check('putting a card back changes nothing',()=>{
   const board=tiled(['4x4','2x2','1x2','2x4','2x2','4x2'],1400);
   for(const carried of board) for(const hold of [[14,STRIP],[carried.width-110,STRIP]]){
     const seen=[carried.col,carried.row],at=slot(board,carried,seen,hold,1400);
     equal(at,seen,`aimed back ${hold}`);
     equal(places(letGo(board,carried,at,1400)),places(board),'let go there');
   }
 });
 await check('a card in the way moves right when its row has room, else straight down',()=>{
   for(const [boardW,rest] of [[1900,[colAfter('4x4'),GAP]],[1104,[GAP,rowAfter('4x4')]]]){
     const big=card('4x4',GAP,GAP),small=card('2x2',GAP,rowAfter('2x4'));
     pack([big,small],METRICS,boardW);
     equal(places([big,small]),[[GAP,GAP],rest],`${boardW}`);
   }
   // Right only if the way there passes no card: a 2x4 over the top of a 4x2, a 1x2 beside the 4x2 under the 2x4 --
   // the 4x2 would pass the 1x2 to clear the 2x4 rightward, so it goes down, under it.
   const wide=card('2x4',Math.floor(SIZES['4x2'][0]/2),GAP),tall=card('4x2',GAP,GAP),low=card('1x2',colAfter('4x2'),rowAfter('2x4'));
   pack([wide,tall,low],METRICS,1900,[wide]);
   equal(places([wide,tall,low]),[[GAP,GAP],[GAP,rowAfter('2x4')],[colAfter('4x2'),rowAfter('2x4')]],'down, not across');
 });
 await check('the slot is the place the card is seen over wherever it is held',()=>{
   const frame=[card('2x2',7,7),card('4x4',518,7)],wide=card('2x4');
   for(const aim of [[24,31],[745,31]]) equal(slotUnder(aim,wide,frame,METRICS,1400,[10,10]),[7,7],`${aim}`);
   // An empty 4x4 held at its body centre, drawn 92 % over the first column.
   equal(slotUnder([530,7+STRIP],card('4x4'),frame,METRICS,1400,[110,7]),[7,7],'body');
 });
 await check('rows come only from the cards in the slot\'s column',()=>{
   const frame=[card('4x4',7,7),card('2x2',854,7),card('2x2',854,422)];
   equal(slotUnder([100,450],card('2x2'),frame,METRICS,1400,[86,429]),[7,674],'slot');
 });
 await check('narrowing packs without rewriting the places',()=>{
   const sizes=['4x4','2x2','2x2','2x2'],arranged=[[7,7],[854,7],[854,422],[7,674]];
   const packed=boardW=>{const cards=sizes.map((size,index)=>card(size,...arranged[index]));pack(cards,METRICS,boardW);return places(cards)};
   equal(packed(1400),arranged,'wide');
   // The 2x2 that stood beside the 4x4 goes below it, and the one under that 2x2 stays under it.
   equal(packed(1100),[[7,7],[518,674],[518,1089],[7,674]],'narrow');
   equal(packed(1400),arranged,'wide again');
 });
 await check('a card stopped by a card above it stays below it',()=>{
   const wide=card('2x4',7,7);
   equal(gravitySlot(card('2x2',854,674),[wide,card('4x4',854,7)],METRICS),[854,674],'under the 4x4');
   // A 1x2 under a 4x4 that starts left of it slides along under it to the 4x4's left edge, and no further.
   equal(gravitySlot(card('1x2',1029,674),[card('1x2',7,7),card('4x4',518,7)],METRICS),[518,674],'to the left edge');
   // Under two cards, the leftmost one bounds it.
   equal(gravitySlot(card('2x4',854,422),[card('2x2',518,7),card('2x2',1029,7)],METRICS),[518,422],'leftmost');
   // Nothing above it: it rises, and on the top margin it slides freely.
   equal(gravitySlot(card('2x2',1365,900),[wide],METRICS),[854,7],'rises');
 });
 await check('the user\'s case: a card let go on a bigger card takes its place',()=>{
   const boardW=2*GAP+SIZES['2x2'][0]+GAP+SIZES['4x4'][0]+35;
   const board=tiled(['2x2','4x4','2x2'],boardW),[topLeft,big,bottomLeft]=board;
   equal(places(board),[[GAP,GAP],[2*GAP+SIZES['2x2'][0],GAP],[GAP,2*GAP+SIZES['2x2'][1]]],'tiled');
   for(const drawn of [[big.col+10,big.row+10],[big.col+200,big.row+150],[big.col+320,big.row+40]])
     for(const hold of [[14,STRIP],[bottomLeft.width-60,STRIP],[Math.floor(bottomLeft.width/2),Math.floor(bottomLeft.height/2)]]){
       const after=letGo(board,bottomLeft,slot(board,bottomLeft,drawn,hold,boardW),boardW);
       equal(places(after),[[topLeft.col,topLeft.row],[bottomLeft.col,bottomLeft.row],[big.col,big.row]],`${drawn} ${hold}`);
     }
 });
 await check('a card in the way is never carried across the card it makes way for',()=>{
   const board=[card('1x2',GAP,GAP),card('2x4',2*GAP+SIZES['1x2'][0],GAP),card('2x2',GAP,2*GAP+SIZES['1x2'][1])];
   const [small,wide,carried]=board;
   equal(places(letGo(board,carried,[wide.col,wide.row],1900)),[[small.col,small.row],[GAP,2*GAP+SIZES['2x2'][1]],[wide.col,wide.row]],'under it');
 });
 await check('a column makes way as one, so its cards keep their order',()=>{
   const right=2*GAP+SIZES['4x2'][0];
   const board=[card('4x2',GAP,GAP),card('2x4',right,GAP),card('1x2',right,2*GAP+SIZES['2x4'][1]),card('1x2',GAP,674),card('2x4',right,711),card('4x2',GAP,963)];
   pack(board,METRICS,1400);
   assert(board[1].row<board[2].row,'packed out of order');
   const after=letGo(board,board[4],[board[0].col,board[0].row],1400);
   assert(after[1].row<after[2].row,`order lost: ${JSON.stringify(places(after))}`);
 });
 await check('random mixed drags keep every rule',()=>{
   // A seeded generator (v2: random.Random(1000)); the boards differ from v2's, the rules do not.
   let seed=1000;
   const random=()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
   const randint=(lo,hi)=>lo+Math.floor(random()*(hi-lo+1)),choice=items=>items[Math.floor(random()*items.length)];
   const overlaps=(a,b)=>a.col<b.col+b.width+GAP&&b.col<a.col+a.width+GAP&&a.row<b.row+b.height+GAP&&b.row<a.row+a.height+GAP;
   /** A horizontal or vertical run from `start` to `end` crosses the inside of `area` (x, y, w, h). */
   const crosses=(start,end,area)=>{
     const [x0,y0,x1,y1]=[area[0]+2,area[1]+2,area[0]+area[2]-2,area[1]+area[3]-2];
     if(start[1]===end[1]){const [low,high]=[start[0],end[0]].sort((a,b)=>a-b);return y0<start[1]&&start[1]<y1&&low<x1&&x0<high}
     const [low,high]=[start[1],end[1]].sort((a,b)=>a-b);return x0<start[0]&&start[0]<x1&&low<y1&&y0<high;
   };
   /** Both L-shaped paths between two centres cross a card that stayed put. */
   const passed=(start,end,stayed)=>start[0]!==end[0]||start[1]!==end[1]
     ? [[end[0],start[1]],[start[0],end[1]]].every(corner=>stayed.some(area=>crosses(start,corner,area)||crosses(corner,end,area))) : false;
   const centre=(c,place)=>[place[0]+Math.floor(c.width/2),place[1]+Math.floor(c.height/2)];
   /** pack's first step on a drop, on copies: where each card made way to before it fell (v2 recorded it by
    * patching gravity_slot; here the step is taken again with makeWay, and the fall from it must give the drop). */
   const madeWay=(board,carriedAt,at,boardW)=>{
     const cards=board.map(c=>box(c.width,c.height,c.col,c.row)),carried=cards[carriedAt],[x,y]=at;
     const target=cards.find(c=>c!==carried&&c.col<=x&&x<c.col+c.width&&c.row<=y&&y<c.row+c.height);
     if(target)[target.col,target.row]=[carried.col,carried.row];
     [carried.col,carried.row]=at;
     const first=target?[carried,target]:[carried],wide=Math.max(boardW,minBoardWidth(cards,METRICS));
     for(const c of cards){c.col=Math.min(Math.max(c.col,GAP),wide-GAP-c.width);c.row=Math.max(c.row,GAP)}
     const rank=new Map(cards.map((c,index)=>[c,index])),reading=(a,b)=>a.row-b.row||a.col-b.col||rank.get(a)-rank.get(b);
     const settled=[],down=new Set();
     for(const c of [...cards].sort((a,b)=>Number(!first.includes(a))-Number(!first.includes(b))||reading(a,b))){
       if(overlapsWithGap([c.col,c.row,c.col+c.width,c.row+c.height],settled,METRICS))makeWay(c,settled,cards,wide,METRICS,down);
       settled.push(c);
     }
     return cards;
   };
   for(let count=0;count<120;count++){
     const sizes=Array.from({length:randint(3,6)},()=>choice(Object.keys(SIZES)));
     if(new Set(sizes).size===1)sizes[0]=sizes[0]!=='4x4'?'4x4':'2x2';
     const boardW=choice([1104,1400,1900]);
     let board=tiled(sizes,boardW);
     const hold=c=>choice([[14,STRIP],[c.width-110,STRIP],[Math.floor(c.width/2),Math.floor(c.height/2)]]);
     for(let drag=randint(1,3);drag>0;drag--){
       const carried=choice(board),seen=[carried.col,carried.row];
       const back=slot(board,carried,seen,hold(carried),boardW);
       equal(back,seen,`aimed back on ${JSON.stringify(places(board))}`);
       equal(places(letGo(board,carried,back,boardW)),places(board),'put back');
       let drawn;
       if(random()<0.5){const target=choice(board.filter(c=>c!==carried));drawn=[target.col+randint(-12,12),target.row+randint(-12,12)]}
       else{const bottom=Math.max(...board.map(c=>c.row+c.height));drawn=[randint(0,boardW-carried.width),randint(0,bottom+100)]}
       const at=slot(board,carried,drawn,hold(carried),boardW);
       const swapped=new Set(board.filter(c=>c===carried||(c.col<=at[0]&&at[0]<c.col+c.width&&c.row<=at[1]&&at[1]<c.row+c.height)));
       const after=letGo(board,carried,at,boardW),way=madeWay(board,board.indexOf(carried),at,boardW);
       for(let index=0;index<after.length;index++)for(const other of after.slice(index+1))assert(!overlaps(after[index],other),`overlap ${JSON.stringify(places(after))}`);
       // What was previewed is what stays: packing its places gives the board again.
       const again=after.map(c=>box(c.width,c.height,c.col,c.row));pack(again,METRICS,boardW);
       equal(places(again),places(after),'repacked');
       const fell=way.map(c=>box(c.width,c.height,c.col,c.row));pack(fell,METRICS,boardW);
       equal(places(fell),places(after),'made way, then fell');
       for(const c of after)equal(gravitySlot(c,after.filter(o=>o!==c),METRICS),[c.col,c.row],`not at rest ${JSON.stringify(places(after))}`);
       const moves=new Map(board.map((b,index)=>[index,[[b.col,b.row],[way[index].col,way[index].row],[after[index].col,after[index].row]]]).filter(([index])=>!swapped.has(board[index])));
       const untouched=[...moves].filter(([,run])=>new Set(run.map(String)).size===1).map(([index])=>[after[index].col,after[index].row,after[index].width,after[index].height]);
       for(const [index,[start,made,end]] of moves){
         const run=JSON.stringify([start,made,end]);
         assert(String(made)===String(start)||(made[1]===start[1]&&made[0]>start[0])||(made[0]===start[0]&&made[1]>start[1]),`made way neither right nor down ${run}`);
         assert(end[0]<=made[0]&&end[1]<=made[1],`fell other than north-west ${run}`);
         for(const [from,to] of [[start,made],[made,end]])assert(!passed(centre(after[index],from),centre(after[index],to),untouched),`passed a card ${run} ${JSON.stringify(places(after))}`);
       }
       board=after;
     }
   }
 });
 await check('the slot is the one under the pointer',()=>{
   const metrics=new BoardMetrics(8),others=[0,1,2].map(()=>box(508,411));
   pack(others,metrics,1128);
   equal(places(others),[[8,8],[524,8],[8,427]],'packed');
   const probe=box(508,411,160,0);
   for(const [pointer,expected] of [[[560,30],[524,8]],[[515,30],[8,8]],[[1100,30],[524,8]],[[600,500],[524,427]],[[3,3],[8,8]],[[100,900],[8,846]]])
     equal(slotUnder(pointer,probe,others,metrics,1128),expected,`${pointer}`);
   equal([probe.col,probe.row],[160,0],'the carried card is not moved');
 });
 await check('a card wider than a column only starts where it fits',()=>{
   const metrics=new BoardMetrics(10),others=[box(100,80),box(100,80)];
   pack(others,metrics,350);
   const wide=box(210,80);
   equal(slotUnder([300,50],wide,others,metrics,350),[120,10],'top');
   equal(slotUnder([300,120],wide,others,metrics,350),[120,100],'below right');
   equal(slotUnder([60,120],wide,others,metrics,350),[10,100],'below left');
 });
 await check('a card put below another stays below it, and two placements survive each other',()=>{
   const metrics=new BoardMetrics(10);
   const above=box(100,80,10,10),below=box(100,80,10,240);
   pack([above,below],metrics,330);
   equal(places([above,below]),[[10,10],[10,100]],'the free slot at (120, 10) is not its place');
   const first=box(100,80,10,10),under=box(100,80,10,100),beside=box(100,80,200,240);
   pack([first,under,beside],metrics,330);
   equal(places([under,beside]),[[10,100],[120,10]],'the earlier placement stands; nothing above the other, it rises');
 });
 await check('a narrow board packs one column and the places are not rewritten',()=>{
   const metrics=new BoardMetrics(10),put=[[10,10],[120,10],[10,100]];
   const packed=boardW=>{const cards=put.map(place=>box(100,80,...place));pack(cards,metrics,boardW);return places(cards)};
   equal(packed(330),put,'wide');
   equal(packed(120),[[10,10],[10,100],[10,190]],'one column, in order');
   equal(packed(330),put,'wide again');
 });
 await check('first free slot tiles the top row then wraps',()=>{
   const metrics=new BoardMetrics(10),placed=[];
   for(let index=0;index<4;index++){const c=box(100,80);[c.col,c.row]=firstFreeSlot(c,placed,330,metrics);placed.push(c)}
   // Two 100-wide cards and their three gaps are all a 330 board holds.
   equal(places(placed),[[10,10],[120,10],[10,100],[120,100]],'tiles');
 });
 document.getElementById('result').textContent=JSON.stringify({passed:true,count:results.length,tests:results});
} catch(error) {document.getElementById('result').textContent=JSON.stringify({passed:false,completed:results,error:String(error.stack)})}
</script>
