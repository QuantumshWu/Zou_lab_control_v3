<!doctype html>
<meta charset="utf-8">
<title>Control window first open probe</title>
<style>html,body{margin:0} iframe{border:0;display:block}</style>
<pre id="result" style="position:absolute;left:-9999px">pending</pre>
<script>
// The native window before its content is measured (chrome.rs place_snug None): half the standard width, the standard height.
window.__probe = { events: [], frames: [], fit: null, shownAt: null, done: false };
const q = location.search;
const frame = document.createElement('iframe');
frame.width = 640; frame.height = 790;
window.__fitFrame = (w, h) => { frame.width = Math.max(640, w); frame.height = Math.round(h); window.__probe.events.push({ event: 'native fit', w, h }); };
window.__show = () => window.__probe.events.push({ event: 'native visible' });
frame.src = 'control_page.html' + q;
document.body.append(frame);
const poll = setInterval(() => { if (window.__probe.done) { clearInterval(poll); document.getElementById('result').textContent = JSON.stringify(window.__probe); } }, 50);
</script>
