[package]
name = "atom-lindblad"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = ["population-core"]
population-core = ["dep:atom-population-core"]
static-numerics = ["atom-population-core?/static-numerics"]

[dependencies]
atom-population-core = { path = "population-core", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast local algorithm iterations. Shipping benchmarks/packages still use release.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

