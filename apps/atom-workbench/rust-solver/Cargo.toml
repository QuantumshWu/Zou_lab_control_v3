[package]
name = "atom-lindblad"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["motion"]

[features]
static-numerics = ["atom-population-core/static-numerics"]

[dependencies]
atom-population-core = { path = "population-core" }
atom-motion = { path = "motion" }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: requests are parsed to the exact double JSON.stringify wrote (the default parser misreads ~6 % of
# a request's numbers by 1-2 ulp).
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast local algorithm iterations. Shipping benchmarks/packages still use release.
[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

