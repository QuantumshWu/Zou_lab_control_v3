[package]
name = "atom-lindblad-embedded"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Compile the existing solver crate root directly as an rlib. There is no
# second numerical source tree and no generated/translated physics copy.
[lib]
path = "../../rust-solver/src/main.rs"

[features]
default = ["static-numerics"]
static-numerics = ["atom-population-core/static-numerics"]

[dependencies]
atom-population-core = { path = "../../rust-solver/population-core" }
atom-motion = { path = "../../rust-solver/motion" }
# float_roundtrip: requests are parsed to the exact double JSON.stringify wrote (the default parser misreads ~6 % of
# a request's numbers by 1-2 ulp).
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[build-dependencies]
sha2 = "=0.10.9"
serde_json = "1.0"
